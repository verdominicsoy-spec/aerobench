name: CI

on:
  push:
  pull_request:

jobs:
  engine:
    name: Engine tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: gmsh's system libraries (macOS has them)
        run: sudo apt-get update -q && sudo apt-get install -y -q libglu1-mesa libxcursor1 libxft2 libxinerama1 libxrender1
      - name: SU2 from conda-forge, for the RANS tests
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: su2
          create-args: su2=8.5.0 python=3.11
          cache-environment: true
      - run: uv sync
        working-directory: engine
      - run: AEROBENCH_SU2="$MAMBA_ROOT_PREFIX/envs/su2/bin/SU2_CFD" uv run pytest -q -rs
        working-directory: engine

  mac:
    name: App build and job-runner tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Engine environment and tests
        run: uv sync && uv run pytest -q
        working-directory: engine
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: AeroBenchKit tests (drive the real engine)
        run: swift test
        working-directory: app/AeroBenchKit
        env:
          AEROBENCH_ENGINE: ${{ github.workspace }}/engine
      - name: Build AeroBench.app with the double-click launcher
        if: ${{ !cancelled() }}
        run: ./AeroBench.command --no-pull --no-launch
      - name: Show the build log
        if: ${{ failure() }}
        run: tail -100 build/last-build.log
      - name: Package AeroBench.dmg with the engine inside
        if: ${{ !cancelled() }}
        run: |
          app/scripts/make_dmg.sh
          hdiutil attach build/AeroBench.dmg -mountpoint /tmp/aerobench-dmg -nobrowse
          test -f /tmp/aerobench-dmg/AeroBench.app/Contents/Resources/AeroBench/engine/pyproject.toml
          test -f /tmp/aerobench-dmg/AeroBench.app/Contents/Resources/AeroBench/engine/uv.lock
          test -d /tmp/aerobench-dmg/AeroBench.app/Contents/Resources/AeroBench/data/tracks
          test ! -e /tmp/aerobench-dmg/AeroBench.app/Contents/Resources/AeroBench/engine/.venv
          codesign --verify --deep /tmp/aerobench-dmg/AeroBench.app
          hdiutil detach /tmp/aerobench-dmg
